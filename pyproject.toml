[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue_db"
version = "1.0.0"
description = "Python API for BLUE_DB, a local-level election database for European countries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "François Hublet" },
    { name = "Nicola Chiecchio" },
]
maintainers = [{ name = "François Hublet", email = "francois.hublet@protonmail.ch" }]
keywords = ["elections", "europe", "political science", "NUTS", "LAU", "GISCO"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology :: History",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    # Geometry resolution (BlueGeo) and plotting: part of the default install.
    "geopandas>=0.14",
    "shapely>=2.0",
    "requests>=2.28",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Kept as a no-op alias so `pip install blue_db[maps]` keeps working; the
# geometry stack is now installed by default.
maps = []
# Cross-validation against EU-NED (eval_ned.py).
eval = ["openpyxl>=3.1"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://electionatlas.eu"
Repository = "https://github.com/blue-electoral-bulletin/BLUE_DB"
Dataset = "https://doi.org/10.5281/zenodo.21434111"

[project.scripts]
blue-db = "blue_db.cli:main"

[tool.setuptools]
packages = ["blue_db"]
include-package-data = false

[tool.setuptools.package-data]
blue_db = ["py.typed", "README.md"]
